<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人作品集</title>
  <meta
    name="description"
    content="一个简洁、现代、适合展示个人经历与项目成果的作品集主页。"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#top" id="site-brand"></a>
      <nav class="site-nav" id="site-nav"></nav>
      <button class="theme-toggle" type="button" aria-label="切换主题">
        <span class="theme-toggle__icon">◐</span>
      </button>
    </header>

    <main id="top">
      <!-- 首屏 -->
      <section class="hero">
        <div class="hero__content">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-name"></h1>
          <p class="hero__lead" id="hero-lead"></p>
          <div class="hero__actions">
            <a class="button button--primary" href="#projects">查看作品</a>
            <a class="button button--ghost" href="#contact">联系我</a>
          </div>
          <ul class="hero__stats" id="hero-stats"></ul>
        </div>

        <div class="hero__card">
          <div class="profile-card">
            <div class="profile-card__avatar" id="profile-avatar"></div>
            <div>
              <h2 id="profile-title"></h2>
              <p id="profile-subtitle"></p>
            </div>
            <ul class="profile-card__tags" id="profile-tags"></ul>
            <p class="profile-card__text" id="profile-text"></p>
          </div>
        </div>
      </section>

      <!-- 以下区块内容全部由 assets/content.js 驱动渲染 -->
      <section class="section" id="about">
        <div class="section__header" id="about-header"></div>
        <div class="about-grid" id="about-grid"></div>
      </section>

      <section class="section" id="projects">
        <div class="section__header" id="projects-header"></div>
        <div class="project-grid" id="project-grid"></div>
      </section>

      <section class="section" id="timeline">
        <div class="section__header" id="timeline-header"></div>
        <div class="timeline" id="timeline-list"></div>
      </section>

      <section class="section section--skills">
        <div class="section__header" id="skills-header"></div>
        <div class="skills-cloud" id="skills-cloud"></div>
      </section>

      <section class="section section--contact" id="contact">
        <div class="section__header" id="contact-header"></div>
        <div class="contact-panel">
          <p id="contact-text"></p>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="./assets/content.js"></script>
  <script src="./assets/script.js"></script>
</body>
</html>
